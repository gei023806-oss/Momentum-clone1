<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Momentum</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --white: #ffffff;
        --white-80: rgba(255, 255, 255, 0.8);
        --white-55: rgba(255, 255, 255, 0.55);
        --white-30: rgba(255, 255, 255, 0.3);
        --shadow: 0 2px 24px rgba(0, 0, 0, 0.45);
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      /* ── Background ── */
      body {
        font-family: "Lato", sans-serif;
        color: var(--white);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
        background: #1a1a2e;
      }

      #bg {
        position: fixed;
        inset: 0;
        z-index: 0;
        background-size: cover;
        background-position: center;
        transition: opacity 1.2s ease;
      }
      #bg::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.08) 0%,
          rgba(0, 0, 0, 0.18) 50%,
          rgba(0, 0, 0, 0.38) 100%
        );
      }

      #top-bar,
      #center,
      #bottom-bar {
        position: relative;
        z-index: 10;
        width: 100%;
      }

      #top-bar {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        padding: 18px 28px;
        gap: 14px;
      }
      .top-btn {
        background: rgba(0, 0, 0, 0.28);
        border: 1px solid var(--white-30);
        color: var(--white);
        border-radius: 20px;
        padding: 6px 16px;
        font-size: 13px;
        cursor: pointer;
        backdrop-filter: blur(6px);
        transition: background 0.2s;
        letter-spacing: 0.3px;
      }
      .top-btn:hover {
        background: rgba(255, 255, 255, 0.18);
      }

      #center {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        text-align: center;
        padding: 0 20px;
      }

      #clock {
        font-size: clamp(5rem, 13vw, 9.5rem);
        font-weight: 700;
        letter-spacing: -3px;
        line-height: 1;
        text-shadow: var(--shadow);
        animation: fadeUp 0.9s ease both;
      }

      #greeting {
        font-size: clamp(1.3rem, 3vw, 2.1rem);
        font-weight: 400;
        text-shadow: var(--shadow);
        margin-top: 4px;
        animation: fadeUp 0.9s 0.15s ease both;
      }

      /* Goal */
      #goal-wrapper {
        margin-top: 22px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        animation: fadeUp 0.9s 0.28s ease both;
      }
      #goal-question {
        font-size: clamp(0.95rem, 2vw, 1.15rem);
        font-weight: 300;
        color: var(--white-80);
        letter-spacing: 0.3px;
      }
      #goal-display {
        font-size: clamp(1rem, 2.2vw, 1.25rem);
        font-weight: 400;
        color: var(--white);
        cursor: pointer;
        border-bottom: 1.5px solid var(--white-55);
        padding-bottom: 4px;
        min-width: 300px;
        text-align: center;
        transition: border-color 0.2s;
      }
      #goal-display:hover {
        border-color: var(--white);
      }

      #goal-input-row {
        display: none;
        align-items: center;
        gap: 0;
      }
      #goal-input-row.active {
        display: flex;
      }
      #goal-input {
        background: transparent;
        border: none;
        border-bottom: 1.5px solid var(--white);
        color: var(--white);
        font-family: "Lato", sans-serif;
        font-size: clamp(1rem, 2vw, 1.2rem);
        font-weight: 300;
        text-align: center;
        outline: none;
        padding: 4px 10px;
        width: 320px;
        caret-color: var(--white);
      }
      #goal-input::placeholder {
        color: var(--white-55);
      }
      #goal-input-submit {
        background: none;
        border: none;
        cursor: pointer;
        color: var(--white-80);
        font-size: 18px;
        padding: 4px 8px;
        transition: color 0.2s;
      }
      #goal-input-submit:hover {
        color: var(--white);
      }

      /* ── Bottom Bar ── */
      #bottom-bar {
        display: flex;
        justify-content: center;
        align-items: flex-end;
        padding: 0 32px 22px;
      }

      #quote-wrap {
        max-width: 700px;
        text-align: center;
        animation: fadeUp 0.9s 0.4s ease both;
      }
      #quote-text {
        font-size: clamp(0.78rem, 1.3vw, 0.92rem);
        font-weight: 300;
        color: var(--white-80);
        font-style: italic;
        line-height: 1.6;
        text-shadow: 0 1px 8px rgba(0, 0, 0, 0.5);
      }
      #quote-author {
        font-size: 0.78rem;
        font-weight: 400;
        color: var(--white-55);
        margin-top: 4px;
        letter-spacing: 0.5px;
      }
      #quote-refresh {
        background: none;
        border: none;
        cursor: pointer;
        color: var(--white-55);
        font-size: 15px;
        margin-left: 8px;
        vertical-align: middle;
        transition:
          color 0.2s,
          transform 0.4s;
      }
      #quote-refresh:hover {
        color: var(--white);
        transform: rotate(180deg);
      }
    </style>
  </head>
  <body>
    <div id="bg"></div>

    <div id="top-bar">
      <button class="top-btn" id="bg-btn">🖼 배경 변경</button>
    </div>

    <div id="center">
      <div id="clock">00:00</div>
      <div id="greeting">안녕하세요, 님.</div>

      <div id="goal-wrapper">
        <div id="goal-question">오늘의 주요 목표는 무엇인가요?</div>

        <div id="goal-display" title="클릭하여 수정">목표를 입력하세요</div>

        <div id="goal-input-row">
          <input
            id="goal-input"
            type="text"
            maxlength="80"
            placeholder="오늘의 목표를 입력하세요…"
            autocomplete="off"
          />
          <button id="goal-input-submit" title="저장 (Enter)">✓</button>
        </div>
      </div>
    </div>

    <div id="bottom-bar">
      <div id="quote-wrap">
        <div>
          <span id="quote-text">"Loading quote…"</span>
          <button id="quote-refresh" title="다른 명언">↻</button>
        </div>
        <div id="quote-author"></div>
      </div>
    </div>

    <script>
      /* ──────────────────────────────────────────────
   QUOTES
────────────────────────────────────────────── */
      const QUOTES = [
        {
          text: "Every day of our lives, we are on the verge of making those slight changes that would make all the difference.",
          author: "Mignon McLaughlin",
        },
        {
          text: "The secret of getting ahead is getting started.",
          author: "Mark Twain",
        },
        {
          text: "It does not matter how slowly you go as long as you do not stop.",
          author: "Confucius",
        },
        {
          text: "You don't have to be great to start, but you have to start to be great.",
          author: "Zig Ziglar",
        },
        {
          text: "Act as if what you do makes a difference. It does.",
          author: "William James",
        },
        {
          text: "Success is not final, failure is not fatal: It is the courage to continue that counts.",
          author: "Winston Churchill",
        },
        {
          text: "Believe you can and you're halfway there.",
          author: "Theodore Roosevelt",
        },
        {
          text: "The only way to do great work is to love what you do.",
          author: "Steve Jobs",
        },
        {
          text: "In the middle of every difficulty lies opportunity.",
          author: "Albert Einstein",
        },
        {
          text: "It always seems impossible until it's done.",
          author: "Nelson Mandela",
        },
        {
          text: "Don't watch the clock; do what it does. Keep going.",
          author: "Sam Levenson",
        },
        { text: "Dream big and dare to fail.", author: "Norman Vaughan" },
        {
          text: "You are never too old to set another goal or to dream a new dream.",
          author: "C.S. Lewis",
        },
        {
          text: "Start where you are. Use what you have. Do what you can.",
          author: "Arthur Ashe",
        },
        {
          text: "The future depends on what you do today.",
          author: "Mahatma Gandhi",
        },
        {
          text: "What you get by achieving your goals is not as important as what you become by achieving your goals.",
          author: "Zig Ziglar",
        },
        { text: "한 걸음 한 걸음이 천 리 길의 시작이다.", author: "노자" },
        {
          text: "가장 어두운 밤도 끝나고, 태양은 다시 뜬다.",
          author: "빅토르 위고",
        },
        {
          text: "오늘 할 수 있는 일을 내일로 미루지 마라.",
          author: "벤저민 프랭클린",
        },
        { text: "포기하지 않는 한 실패는 없다.", author: "작자 미상" },
      ];

      let quoteIndex = Math.floor(Math.random() * QUOTES.length);

      function showQuote(q) {
        const el = document.getElementById("quote-text");
        const au = document.getElementById("quote-author");
        el.style.opacity = 0;
        au.style.opacity = 0;
        setTimeout(() => {
          el.textContent = `"${q.text}"`;
          au.textContent = `— ${q.author}`;
          el.style.transition = au.style.transition = "opacity 0.6s";
          el.style.opacity = 1;
          au.style.opacity = 1;
        }, 300);
      }

      function nextQuote() {
        quoteIndex = (quoteIndex + 1) % QUOTES.length;
        showQuote(QUOTES[quoteIndex]);
      }

      showQuote(QUOTES[quoteIndex]);
      document
        .getElementById("quote-refresh")
        .addEventListener("click", nextQuote);

      setInterval(nextQuote, 5 * 60 * 1000);

      function getGreeting(h) {
        if (h < 5) return "좋은 밤이에요, 님.";
        if (h < 12) return "좋은 아침이에요, 님.";
        if (h < 18) return "좋은 오후예요, 님.";
        return "좋은 저녁이에요, 님.";
      }

      function updateClock() {
        const now = new Date();
        const h = now.getHours();
        const m = String(now.getMinutes()).padStart(2, "0");
        // Display 12h without seconds (like Momentum)
        const h12 = h % 12 || 12;
        document.getElementById("clock").textContent = `${h12}:${m}`;
        document.getElementById("greeting").textContent = getGreeting(h);
      }
      updateClock();
      setInterval(updateClock, 1000);

      const goalDisplay = document.getElementById("goal-display");
      const goalInputRow = document.getElementById("goal-input-row");
      const goalInput = document.getElementById("goal-input");
      const goalSubmit = document.getElementById("goal-input-submit");

      const savedGoal = localStorage.getItem("momentum_goal");
      if (savedGoal) goalDisplay.textContent = savedGoal;

      function enterEditMode() {
        goalDisplay.style.display = "none";
        goalInputRow.classList.add("active");
        goalInput.value =
          goalDisplay.textContent === "목표를 입력하세요"
            ? ""
            : goalDisplay.textContent;
        goalInput.focus();
      }

      function saveGoal() {
        const val = goalInput.value.trim();
        goalDisplay.textContent = val || "목표를 입력하세요";
        if (val) localStorage.setItem("momentum_goal", val);
        else localStorage.removeItem("momentum_goal");
        goalDisplay.style.display = "";
        goalInputRow.classList.remove("active");
      }

      goalDisplay.addEventListener("click", enterEditMode);
      goalSubmit.addEventListener("click", saveGoal);
      goalInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") saveGoal();
        if (e.key === "Escape") {
          goalDisplay.style.display = "";
          goalInputRow.classList.remove("active");
        }
      });

      const BG_IMAGES = [
        "https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1920&q=80",
        "https://images.unsplash.com/photo-1470770903676-69b98201ea1c?w=1920&q=80",
        "https://images.unsplash.com/photo-1490750967868-88df5691892b?w=1920&q=80",
        "https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?w=1920&q=80",
        "https://images.unsplash.com/photo-1465146344425-f00d5f5c8f07?w=1920&q=80",
        "https://images.unsplash.com/photo-1501854140801-50d01698950b?w=1920&q=80",
        "https://images.unsplash.com/photo-1433086966358-54859d0ed716?w=1920&q=80",
      ];

      let bgIndex =
        parseInt(localStorage.getItem("momentum_bg") || "0") % BG_IMAGES.length;
      const bgEl = document.getElementById("bg");

      function loadBg(idx) {
        bgEl.style.backgroundImage = `url('${BG_IMAGES[idx]}')`;
        localStorage.setItem("momentum_bg", idx);
      }

      loadBg(bgIndex);

      document.getElementById("bg-btn").addEventListener("click", () => {
        bgIndex = (bgIndex + 1) % BG_IMAGES.length;
        loadBg(bgIndex);
      });
    </script>
  </body>
</html>
